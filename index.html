<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CSC 101 Quiz 2 Practice</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#1d2433;--mute:#5d6678;--line:#dfe3ee;--brand:#2f5bea;--brandsoft:#e8edff;--ok:#12803c;--oksoft:#e3f6ea;--bad:#c0262d;--badsoft:#fdeaea;--warn:#b45309;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10131b;--card:#1a1f2b;--ink:#e8ecf5;--mute:#9aa3b7;--line:#2c3446;--brand:#7c9bff;--brandsoft:#232c4a;--ok:#4cc27a;--oksoft:#16301f;--bad:#ff7b80;--badsoft:#3a1c1f;--warn:#f5a54a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10131b;--card:#1a1f2b;--ink:#e8ecf5;--mute:#9aa3b7;--line:#2c3446;--brand:#7c9bff;--brandsoft:#232c4a;--ok:#4cc27a;--oksoft:#16301f;--bad:#ff7b80;--badsoft:#3a1c1f;--warn:#f5a54a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px}
.bar{max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:700;font-size:15px}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:18px;background:var(--brandsoft);color:var(--brand);padding:4px 12px;border-radius:999px}
.timer.low{background:var(--badsoft);color:var(--bad)}
.prog{max-width:720px;margin:8px auto 0;height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--brand);width:0;transition:width .25s}
main{max-width:720px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
h1{font-size:26px;line-height:1.2;margin:0 0 8px}
h2{font-size:19px;margin:0 0 6px}
p{margin:0 0 10px}
.mute{color:var(--mute);font-size:14px}
.pill{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--brand);background:var(--brandsoft);padding:3px 10px;border-radius:999px;margin-bottom:10px}
.q{font-size:18px;font-weight:600;line-height:1.4;margin:0 0 14px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;font:inherit;cursor:pointer}
.opt:hover{border-color:var(--brand)}
.opt .l{flex:none;width:28px;height:28px;border-radius:50%;background:var(--brandsoft);color:var(--brand);font-weight:700;display:grid;place-items:center;font-size:14px}
.opt.sel{border-color:var(--brand);background:var(--brandsoft)}
.opt.sel .l{background:var(--brand);color:#fff}
.nav{display:flex;gap:10px;justify-content:space-between;margin-top:6px}
button.btn{font:inherit;font-weight:700;border-radius:12px;padding:12px 18px;border:2px solid var(--brand);background:var(--brand);color:#fff;cursor:pointer;min-height:48px}
button.btn.ghost{background:transparent;color:var(--brand)}
button.btn:disabled{opacity:.4;cursor:default}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0}
.dot{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);font-size:12px;display:grid;place-items:center;background:var(--card);color:var(--mute);cursor:pointer}
.dot.done{background:var(--brandsoft);color:var(--brand);border-color:var(--brand)}
.dot.cur{outline:2px solid var(--brand);outline-offset:1px}
.score{font-size:44px;font-weight:800;line-height:1}
.rev{border-left:5px solid var(--bad);background:var(--badsoft);border-radius:10px;padding:12px 14px;margin:12px 0}
.rev b.k{color:var(--ok)} .rev b.w{color:var(--bad)}
.why{margin-top:8px;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:8px;font-size:15px}
.allgood{border-left:5px solid var(--ok);background:var(--oksoft);border-radius:10px;padding:12px 14px}
.row{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:14px}
.row .n{width:70px;flex:none;color:var(--mute)} .row .t{flex:1;height:10px;background:var(--line);border-radius:6px;overflow:hidden} .row .t i{display:block;height:100%;background:var(--brand)} .row .v{width:44px;text-align:right;font-weight:700}
ul.rules{padding-left:20px;margin:0 0 12px} ul.rules li{margin-bottom:4px}

/* Self-contained schematic Task Manager panels for questions that require visual comparison. */
.visual{border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 16px;background:var(--bg)}
.visual-title{font-weight:750;font-size:14px;margin:0 0 10px;color:var(--mute);letter-spacing:.02em}
.visual-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:10px}
.visual-device{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0}
.visual-device h3{font-size:15px;line-height:1.3;margin:0 0 10px;overflow-wrap:anywhere}
.visual-stat{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-top:1px solid var(--line);font-size:14px}
.visual-stat span:first-child{color:var(--mute)}.visual-stat strong{font-variant-numeric:tabular-nums;text-align:right}
.visual-caption{font-size:12px;color:var(--mute);margin:10px 0 0}
</style>
</head>

<script>
const D=[{"q":"Which option correctly lists the components of a computing environment other than hardware and software?","o":["Data, people, procedures, and communication and networks","Data, input, output and storage","People, ALU, cache and registers","Users, monitors, printers and scanners"],"a":0,"e":"Data, people, procedures and communication/networks are the four parts beyond hardware and software."},{"q":"In the ATM example, which action is best classified as processing?","o":["The ATM and connected banking system verifying the card details and handling the request","The user choosing a transaction on the screen","Cash being dispensed to the user","A receipt being printed for the user"],"a":0,"e":"Verifying details and handling the request is processing; choosing, cash and receipts are input or output."},{"q":"Why is the input–processing–output–storage (IPOS) model considered a simplified way to describe a computer system?","o":["Because real systems never store information","Because real systems may perform several activities at the same time rather than in four strictly separate steps","Because input and output are identical","Because processing always happens after output"],"a":1,"e":"IPOS is useful for learning, but real computers can process, store, receive and produce information concurrently."},{"q":"A 16 GB RAM module and a 16 GB SSD hold the same amount of data. Which statement best reflects the warning not to confuse capacity with purpose?","o":["They are interchangeable because their capacities are equal","The SSD is volatile and RAM is persistent","Both exist only to display results to the user","They serve different roles: RAM is working memory for running tasks, while the SSD retains files when power is off"],"a":3,"e":"Equal capacity does not mean equal purpose: RAM is volatile working memory, an SSD keeps files without power."},{"q":"Which software and category pairing is correct?","o":["Operating system - utility/security software","Word processor - system software","Presentation program - application software","Disk-protection tool - application hardware"],"a":2,"e":"A presentation program helps a user do a task, so it is application software."},{"q":"A recipe is written as numbered steps. The same steps can be expressed in ordinary language, pseudocode or a flowchart. What does this demonstrate?","o":["An algorithm is valid only when written as program code","Only flowcharts can represent an algorithm","Pseudocode is a type of hardware","An algorithm is a defined sequence of steps that can be represented in different forms"],"a":3,"e":"An algorithm is the ordered steps for solving a problem; it can be written in words, pseudocode or a diagram."},{"q":"Which situation is an example of automation?","o":["A clerk manually checks every account balance each morning","A teacher writes arithmetic steps on a board","A banking system automatically sends an alert when an account falls below a preset balance","A student reads a printed list of account numbers"],"a":2,"e":"Automation uses technology to carry out a task according to rules, with less continuous human intervention."},{"q":"A network card and a router both belong to which hardware category?","o":["Input devices","Communication devices or components","Output devices","Storage devices"],"a":1,"e":"A NIC and a router exist to exchange data, so they are communication components."},{"q":"Which example best shows data being turned into information?","o":["A list of unprocessed exam scores typed into a sheet","A column of student ID numbers","Raw exam scores are processed into a table showing each class’s average and highest mark","A single score read aloud without any context"],"a":2,"e":"Processing raw scores into averages and highest marks makes them meaningful information."},{"q":"Which set contains examples of everyday activities that use computing?","o":["Abacus counting, Pascaline arithmetic, ENIAC and the IBM 1401","Vacuum tubes, transistors, integrated circuits and microprocessors","Mobile money, online learning, healthcare services and digital government services","Fetch, decode, execute and cache"],"a":2,"e":"Mobile money, online learning, healthcare and government services are practical applications of computing."},{"q":"Which definition best describes a computer?","o":["An electronic system that accepts data, processes it according to instructions, produces results and can store information","An electronic system that only performs arithmetic","A device whose only purpose is to display information","A machine used only to store files permanently"],"a":0,"e":"A computer accepts input, processes data, produces output and can store information."},{"q":"A company rule says backups must be made every Friday and checked by a supervisor. Which component of a computing environment does this rule represent?","o":["Data","Hardware","Procedures","Communication and networks"],"a":2,"e":"Rules or steps for operating a system are procedures."},{"q":"Which computing discipline is most directly concerned with detecting suspicious activity on a computer network?","o":["Cybersecurity","Information Technology support","Computer graphics","Software project management"],"a":0,"e":"Cybersecurity focuses on protecting systems and networks and detecting or responding to threats."},{"q":"Which group contains areas commonly associated with Computer Science?","o":["Networking, IT support, cybersecurity and cloud operations","Algorithms, data structures, operating systems and theory of computation","Payroll, library, hospital and banking systems","Requirements analysis, software testing, documentation and maintenance"],"a":1,"e":"Algorithms, data structures, operating systems and theory of computation are core Computer Science areas."},{"q":"Which group contains areas commonly associated with Information Technology?","o":["Algorithms, computer graphics, programming and machine learning","Networking, system administration, cloud computing and database administration","Requirements analysis, software design, coding and testing","Student, payroll, hospital and library information systems"],"a":1,"e":"Information Technology focuses on deploying, operating and supporting computing systems and infrastructure."},{"q":"Which is an example of an Information System used by an organisation?","o":["A theory explaining computation","A library management system","A machine-learning algorithm by itself","A computer processor architecture"],"a":1,"e":"A library management system organises information and supports library operations."},{"q":"A team writes and maintains manuals that describe how a system works. Which Software Engineering responsibility is this?","o":["Requirements analysis","Documentation","Testing","Software design"],"a":1,"e":"Creating and maintaining system manuals is the Documentation responsibility."},{"q":"A manager plans, coordinates and delivers a software project on schedule. Which Software Engineering responsibility is this?","o":["Maintenance","Coding","Project management","Requirements analysis"],"a":2,"e":"Planning, coordinating and delivering a project is project management."},{"q":"Which statement best distinguishes Data Science from Artificial Intelligence?","o":["Data Science extracts useful insights from data; AI develops systems that perform tasks associated with human intelligence","Data Science protects networks from attacks; AI manages databases","Data Science designs computer hardware; AI manages payroll","They are two names for exactly the same discipline"],"a":0,"e":"Data Science focuses on extracting insights from data; AI focuses on systems that perform tasks such as prediction, recognition or language processing."},{"q":"Which pairing of computing area and discipline is correct?","o":["Operating systems — Computer Science; system administration — Information Technology","Operating systems — Information Systems; system administration — Computer Science","Operating systems — Information Technology; system administration — Software Engineering","Operating systems — Software Engineering; system administration — Information Systems"],"a":0,"e":"Operating systems are a Computer Science area; system administration is commonly part of IT."},{"q":"Which pairing of Computer Science area and description is correct?","o":["Theory of computation - writing instructions for computers","Data structures - managing computer networks","Programming - creating and manipulating images","Computer architecture - designing computer hardware"],"a":3,"e":"Computer architecture is about designing computer hardware."},{"q":"Which sequence shows a sensible order for developing software?","o":["Coding, maintenance, requirements analysis, testing, design","Testing, coding, design, requirements analysis, maintenance","Requirements analysis, software design, coding, testing, maintenance","Maintenance, coding, testing, requirements analysis, design"],"a":2,"e":"A typical development sequence is to understand requirements, design the solution, code it, test it and then maintain it."},{"q":"Which early device is described as including design concepts of input, processing, memory and output?","o":["The abacus","The Pascaline","The Analytical Engine","The IBM 1401"],"a":2,"e":"Babbage's Analytical Engine design included input, processing, memory and output."},{"q":"Which statement correctly compares two early computing devices?","o":["The Pascaline was designed by Charles Babbage, while the Analytical Engine was developed by Pascal","Both were first-generation vacuum-tube computers","Both were fourth-generation microprocessor systems","The Pascaline was a 17th-century mechanical calculator by Blaise Pascal, while the Analytical Engine was designed by Charles Babbage"],"a":3,"e":"Pascal made the Pascaline calculator; Babbage designed the Analytical Engine."},{"q":"Which comparison between ENIAC and the IBM 1401 is accurate?","o":["ENIAC was second generation; IBM 1401 was first generation","Both were third-generation integrated-circuit computers","ENIAC was a first-generation computer; the IBM 1401, introduced in 1959, was a second-generation business data-processing computer","ENIAC was a microprocessor-based personal computer; IBM 1401 was a smartwatch"],"a":2,"e":"ENIAC used first-generation vacuum-tube technology; the IBM 1401 was a second-generation transistor-based business computer."},{"q":"Why did placing multiple electronic components on a single chip matter for third-generation computers?","o":["It required computers to be larger and hotter","It replaced the need for any software","It made computers depend on vacuum tubes again","It improved speed and reliability and reduced size"],"a":3,"e":"Integrated circuits put many components on one chip, giving more speed and reliability in less space."},{"q":"Placing the CPU on a single chip contributed to which development?","o":["The spread of personal computers, laptops, smartphones and embedded computing systems","The invention of the abacus","The first use of vacuum tubes","The construction of the Pascaline"],"a":0,"e":"The single-chip CPU (microprocessor) made PCs, laptops, smartphones and embedded systems widespread."},{"q":"Which technology is least associated with fifth-generation and modern computing?","o":["Vacuum tubes","Internet of Things","Quantum-computing research","Cloud computing"],"a":0,"e":"Vacuum tubes are associated with early first-generation computers, not modern computing themes."},{"q":"Which technology is most closely associated with second-generation computers?","o":["Vacuum tubes","Transistors","Integrated circuits","Microprocessors"],"a":1,"e":"Second-generation computers used transistors, which were smaller and more reliable than vacuum tubes."},{"q":"Which pair of tasks is matched to the correct computer category?","o":["Processing very large bank transaction volumes - embedded system; space-research simulation - smartwatch","Hosting a university website - supercomputer; controlling a washing machine - mainframe","Processing very large bank transaction volumes - mainframe; space-research simulation - supercomputer","A student writing an assignment - mainframe; weather forecasting - embedded system"],"a":2,"e":"Mainframes handle huge transaction loads; supercomputers run scientific simulations."},{"q":"Which device pairing is correctly classified?","o":["Smartwatch - mainframe; microwave controller - server","Smartwatch - supercomputer; microwave controller - workstation","Smartwatch - mobile device; microwave controller - embedded system","Smartwatch - workstation; microwave controller - mobile device"],"a":2,"e":"A smartwatch is a mobile device; a microwave controller is an embedded system."},{"q":"What is a workstation?","o":["A computer built into an appliance to perform one dedicated task","A high-performance computer used for professional or technical work such as engineering, graphics and AI development","A computer that only provides web pages and email to other computers","A computer used only for climate modelling"],"a":1,"e":"Workstations are high-performance computers designed for demanding professional and technical workloads."},{"q":"Which set of characteristics is most closely associated with modern fifth-generation computing?","o":["Mechanical gears and counting boards","Smart systems, automation, AI and learning-based applications","Vacuum tubes and room-sized machines","Only single-purpose controllers inside appliances"],"a":1,"e":"Modern computing is associated with intelligent systems, automation and advanced computing approaches."},{"q":"Drones flying over fields to collect images for farm monitoring belong to which application sector?","o":["Agriculture","Transportation","Government","Entertainment"],"a":0,"e":"Drones monitoring fields are an agriculture application."},{"q":"Which sector and application pairing is correct?","o":["Education - fraud detection","Agriculture - telemedicine","Banking and finance - traffic management","Entertainment - music streaming"],"a":3,"e":"Music streaming is an entertainment application; the other pairings mix up sectors."},{"q":"How does a ride-hailing application differ from GPS navigation?","o":["It coordinates a service between passengers and drivers, and may use GPS as one component","It is only a map used for finding routes","It is a tax system for transport","It replaces all hardware in a vehicle"],"a":0,"e":"Ride-hailing coordinates passengers and drivers and may use GPS; GPS alone handles location and routes."},{"q":"Which statement best describes the role of AI-assisted diagnosis in healthcare?","o":["AI makes every diagnosis without any human involvement","It is used only for scheduling appointments","It is a type of electronic payment system","It can help healthcare professionals analyse information, but does not mean every diagnosis is made autonomously by AI"],"a":3,"e":"AI can support healthcare professionals with analysis. Clinical decisions still require appropriate professional judgement."},{"q":"Which group contains only professional skills important in computing careers?","o":["Programming, networking, databases and cybersecurity","Communication, teamwork, problem-solving, ethics, adaptability and continuous learning","Programming, teamwork, networking and database administration","Databases, communication, systems administration and cybersecurity"],"a":1,"e":"Communication, teamwork, problem-solving, ethics, adaptability and continuous learning are professional skills."},{"q":"A developer's team adopts a new framework. The developer adjusts to the change and learns how to use it. Which two professional skills are demonstrated?","o":["Adaptability and continuous learning","Programming and networking","Teamwork and cybersecurity","Database management and systems administration"],"a":0,"e":"Adapting to a new tool demonstrates adaptability; learning it demonstrates continuous learning."},{"q":"In the mobile money example, which items belong to the Data category?","o":["Customer smartphone, server and network equipment","Mobile money application and transaction-processing software","Phone number, account balance, transaction amount and PIN","Customers, merchants, agents and the service provider"],"a":2,"e":"Phone number, balance, amount and PIN are data; the other options are hardware, software or users."},{"q":"Which set correctly classifies mobile money steps?","o":["Entering the recipient number - input; verifying the PIN - processing; showing a confirmation - output","Entering the recipient number - output; verifying the PIN - input; showing a confirmation - processing","Entering the recipient number - processing; verifying the PIN - output; showing a confirmation - input","Entering the recipient number - storage; verifying the PIN - output; showing a confirmation - input"],"a":0,"e":"Entering the recipient is input, checking the PIN is processing, the confirmation is output."},{"q":"In the ride-hailing application analysis, which items are inputs?","o":["Driver details, fare estimate and trip status","Ride request, destination and pickup point","Matching, route calculation and fare calculation","Smartphones, servers and network infrastructure"],"a":1,"e":"Inputs are what the user supplies: request, destination and pickup point."},{"q":"Which education application delivers assessments electronically?","o":["Digital libraries","Online examinations","Virtual classrooms","Student-information systems"],"a":1,"e":"Online examinations deliver assessments electronically."},{"q":"A citizen applies for a passport through a government web portal. Which application is this?","o":["Medical imaging","An online government application system","Automated irrigation","Digital content creation"],"a":1,"e":"A digital passport portal is an online government application system."},{"q":"Why are professional skills not optional even for a technically skilled computing professional?","o":["Because technical skills are not needed in computing jobs","Computing work involves explaining requirements, collaborating, solving problems, making ethical decisions and learning new technologies","Because professional skills replace programming entirely","Because employers value only communication"],"a":1,"e":"Computing work needs explaining requirements, teamwork, problem-solving, ethics and learning."},{"q":"Which statement correctly describes a computer's system unit?","o":["It is the firmware chip that starts the computer","It is another name for form factor","It is the enclosure that contains the computer's main components","It is a type of pointing device"],"a":2,"e":"The system unit is the enclosure that contains the main hardware components."},{"q":"A mini PC has 16 GB DDR4-3200 memory, a 512 GB M.2 PCIe SSD, an Intel Core i7-13700H processor and integrated Intel Iris Xe graphics. Which specification describes its storage?","o":["16 GB DDR4-3200","Intel Core i7-13700H","Integrated Intel Iris Xe graphics","512 GB M.2 PCIe SSD"],"a":3,"e":"The 512 GB M.2 PCIe SSD is the storage device. The 16 GB figure is RAM, the Core i7 is the CPU and Iris Xe is graphics."},{"q":"Which pairing of motherboard feature and function is correct?","o":["Rear I/O ports - supply stable power to the CPU","CMOS battery - connect graphics cards and sound cards","Rear I/O ports - connect USB, video, audio and network devices","Storage connectors (SATA) - hold RAM modules"],"a":2,"e":"Rear I/O ports connect external USB, video, audio and network devices."},{"q":"A computer repeatedly forgets its date and time after being unplugged. Which motherboard component is most directly associated with keeping settings and time?","o":["Chipset heatsink","Memory slot","CMOS battery","PCIe expansion slot"],"a":2,"e":"The CMOS battery keeps system settings and the time."},{"q":"Which pair of ports is commonly used to connect a computer to an external monitor, television or projector?","o":["USB-A and Ethernet (RJ45)","HDMI and VGA","Ethernet (RJ45) and audio","USB-A and audio"],"a":1,"e":"HDMI and VGA are display interfaces used to connect external screens or projectors."},{"q":"A game controller, a barcode reader and a microphone share which classification?","o":["Output devices","Secondary storage devices","Input devices","Processing components"],"a":2,"e":"Game controllers, barcode readers and microphones all feed data in: input devices."},{"q":"Which mouse-action pairing is correct?","o":["Double-click - show a menu; right-click - open an item; drag - scroll","Click - open an item; scroll - move an item; drag - show a menu","Double-click - open an item; right-click - show a menu; drag - move an item","Right-click - select an item; click - show a menu; scroll - open an item"],"a":2,"e":"Double-click opens, right-click shows a menu, drag moves an item."},{"q":"A smart light switches on when someone walks into a room. Which sensor type is most directly involved?","o":["Temperature sensor","Motion sensor","Pressure sensor","Biometric reader"],"a":1,"e":"A motion sensor detects movement in the environment."},{"q":"Which task is NOT performed by a scanner?","o":["Converting a printed document into a digital file","Scanning a photograph","Digitising paper records for archiving","Producing large volumes of printed text on paper"],"a":3,"e":"A scanner converts physical documents or photographs into digital files. Producing printed copies is a printer's job."},{"q":"Why might a tablet and a desktop tower be described as having different form factors?","o":["Form factor describes how many cycles the CPU performs per second","Form factor describes physical size, shape, layout and mounting design","Form factor describes how much data the SSD can store","Form factor describes which software is installed"],"a":1,"e":"Form factor means physical size, shape, layout and mounting design."},{"q":"A student must choose computer hardware for programming, data analysis and graphics work. Which approach is most appropriate?","o":["Compare the CPU, RAM, storage and graphics against the actual software, workload and budget","Choose the computer with the largest screen without checking other specifications","Choose the most expensive computer because it must be best","Ignore RAM and storage because the CPU determines everything"],"a":0,"e":"Hardware should be selected by matching the specifications to the intended tasks, software requirements and budget."},{"q":"Which pointing device is commonly built into a laptop below the keyboard?","o":["Touchpad","Trackball","Stylus","Flatbed scanner"],"a":0,"e":"A touchpad is a built-in pointing device commonly located below a laptop keyboard."},{"q":"Comparing the Ryzen 7 7445HS and the Core Ultra 9 290HX Plus, which statement is correct?","o":["Both list an NPU and the same L3 cache","The AMD chip lists 24 cores and the Intel chip 6 cores","The AMD chip has the higher boost clock at 5.5 GHz","The Intel chip lists 36 MB of L3 cache and an NPU, while the AMD chip lists 16 MB and no NPU"],"a":3,"e":"The Intel chip lists 36 MB L3 and an NPU; the Ryzen lists 16 MB and no NPU."},{"q":"Which set of facts describes the AMD Ryzen 7 7445HS in the comparison?","o":["24 cores, 12 threads, 5.5 GHz boost clock and an NPU","6 cores, 12 threads, 5.5 GHz boost clock and an NPU","24 cores, 36 MB L3 cache and an NPU","6 cores, 12 threads, 4.7 GHz boost clock and no NPU"],"a":3,"e":"The 7445HS has 6 cores, 12 threads, a 4.7 GHz boost clock and no NPU."},{"q":"Which statement about the RTX 5070 and RTX 5070 Ti is correct?","o":["The 5070 Ti has lower memory bandwidth and fewer CUDA cores","The RTX 5070 has the slightly higher boost clock, while the 5070 Ti has more CUDA cores and more memory bandwidth","The two cards use different architectures","The 5070 has 16 GB of memory and the 5070 Ti has 12 GB"],"a":1,"e":"The 5070 boost clock (2.51 GHz) is slightly higher, but the Ti has more CUDA cores and bandwidth."},{"q":"Which statement correctly describes Intel's 13th Generation Core processors?","o":["They introduced vacuum tubes","They introduced the first integrated circuits","They expanded the hybrid design with more Efficient-cores in many models","They introduced P-cores and E-cores for the first time"],"a":2,"e":"Intel's 12th Generation introduced the P-core/E-core hybrid design; 13th Generation expanded it in many models."},{"q":"A computer uses an Intel Core i5-1135G7 processor. Which generation does the model number indicate?","o":["10th Generation","12th Generation","11th Generation","13th Generation"],"a":2,"e":"The leading '11' in i5-1135G7 identifies it as an 11th Generation Intel Core processor."},{"q":"An Intel Core i7-10700K processor belongs to which generation?","o":["7th Generation","12th Generation","13th Generation","10th Generation"],"a":3,"e":"The leading '10' in i7-10700K identifies it as a 10th Generation Intel Core processor."},{"q":"Which factor does NOT directly determine CPU performance?","o":["Number of cores","Cache size","The workload being performed","Monitor refresh rate"],"a":3,"e":"CPU performance is affected by factors such as architecture, cores, cache, efficiency and workload. Monitor refresh rate is a display characteristic."},{"q":"Which processor-generation pairing is accurate?","o":["First generation — multi-core processors (1990s–2010s)","Fourth generation — multi-core processors (1990s–2010s)","Second generation — AI acceleration (2010s–present)","Third generation — vacuum tubes (1940s–1950s)"],"a":1,"e":"The fourth generation is associated with multi-core processors; earlier generations used vacuum tubes, transistors and integrated circuits."},{"q":"A CPU has fetched an instruction and has worked out that it means ‘add two numbers’. Which step of the cycle comes next?","o":["Execute","Fetch","Decode","Permanent storage"],"a":0,"e":"After fetch and decode, the CPU executes the instruction."},{"q":"A researcher runs a simulation that needs huge numbers of calculations performed at the same time. Which processor type is best known for this kind of parallel processing?","o":["Registers","GPU","BIOS/UEFI chip","Chipset"],"a":1,"e":"A GPU is specialised for graphics and many tasks in parallel."},{"q":"A Windows Task Manager CPU panel reports the specifications shown below for an Intel Core i5-1135G7. Which interpretation is correct?","o":["It has more physical cores than logical processors","Its L1 cache is larger than its L2 and L3 caches","It has twice as many logical processors as physical cores, and its L3 cache is the largest listed cache","Its L3 cache is 5.0 MB"],"a":2,"e":"The panel shows 4 cores, 8 logical processors, and cache sizes of L1 320 KB, L2 5.0 MB and L3 8.0 MB. Eight is twice four, and 8.0 MB is the largest cache value.","visual":{"title":"Task Manager · CPU performance","devices":[{"name":"Intel Core i5-1135G7","stats":[["Utilization","16%"],["Current speed","3.45 GHz"],["Base speed","2.42 GHz"],["Sockets","1"],["Cores","4"],["Logical processors","8"],["L1 cache","320 KB"],["L2 cache","5.0 MB"],["L3 cache","8.0 MB"]]}],"caption":"Schematic recreation of the information panel. Values are supplied in the question; this is not a screenshot."}},{"q":"Compare the two CPU panels below. What is the main difference between the Intel Core i7-10700K and the Intel Core i5-1135G7?","o":["The i7-10700K has 8 cores, 16 logical processors and 16.0 MB L3 cache; the i5-1135G7 has 4 cores, 8 logical processors and 8.0 MB L3 cache","The i7-10700K has 4 cores, 8 logical processors and 8.0 MB L3 cache","The i7-10700K has 16 cores and 8 logical processors","The i7-10700K has a lower base speed of 2.42 GHz"],"a":0,"e":"The i7-10700K panel shows 8 cores, 16 logical processors and 16.0 MB L3 cache. The i5-1135G7 panel shows 4 cores, 8 logical processors and 8.0 MB L3 cache.","visual":{"title":"Task Manager · Compare CPU performance","devices":[{"name":"Intel Core i5-1135G7","stats":[["Cores","4"],["Logical processors","8"],["L1 cache","320 KB"],["L2 cache","5.0 MB"],["L3 cache","8.0 MB"]]},{"name":"Intel Core i7-10700K","stats":[["Cores","8"],["Logical processors","16"],["L1 cache","512 KB"],["L2 cache","2.0 MB"],["L3 cache","16.0 MB"]]}],"caption":"Schematic comparison of the two Task Manager examples. Values are supplied in the question; this is not a screenshot."}},{"q":"A 2026 Intel Core Ultra processor is described as using Intel 18A technology. Which improvements are associated with this generation?","o":["The first use of vacuum tubes","A return to single-core processors","The replacement of RAM with cache","Improved CPU performance, power efficiency, integrated graphics and AI acceleration"],"a":3,"e":"The 2026 Core Ultra entry highlights improvements in CPU performance, efficiency, integrated graphics and AI acceleration."},{"q":"Which statement correctly describes what happens to the operating system during startup?","o":["It is loaded from RAM into the BIOS chip","It is permanently stored in the cache","It is loaded from storage into RAM after firmware checks the hardware","It is loaded from the monitor into the CPU"],"a":2,"e":"After firmware checks the hardware, the OS loads from storage into RAM."},{"q":"Which stage of startup involves BIOS/UEFI checking the hardware and starting the boot process?","o":["Power on","Operating system loads","Desktop appears","Firmware initialisation"],"a":3,"e":"Firmware initialisation is when BIOS/UEFI checks hardware and starts booting."},{"q":"Which item is an example of something held in RAM while in use?","o":["The permanent boot instructions of the computer","A photo archive on an external drive","The firmware in the BIOS/UEFI chip","A game that is currently running"],"a":3,"e":"RAM holds what is in use now, such as a running game."},{"q":"A buyer wants a silent, durable drive and accepts a higher cost per unit of capacity. Which drive fits?","o":["SSD","HDD","ROM","Registers"],"a":0,"e":"SSDs are silent and durable but cost more per capacity."},{"q":"Which feature is associated with an HDD rather than an SSD in the comparison?","o":["Flash memory and silent operation","Spinning disks with typically larger, cheaper capacity","Greater durability","Faster speed"],"a":1,"e":"HDDs use spinning disks and typically offer larger, cheaper capacity."},{"q":"Which sequence lists storage units from smallest to largest?","o":["Byte, kilobyte, megabyte, gigabyte, terabyte","Byte, megabyte, kilobyte, terabyte, gigabyte","Kilobyte, byte, gigabyte, megabyte, terabyte","Terabyte, gigabyte, megabyte, kilobyte, byte"],"a":0,"e":"Units grow from byte to kilobyte, megabyte, gigabyte and terabyte."},{"q":"ROM is non-volatile memory used to store which type of information?","o":["Temporary working data for open applications","Long-term user files on spinning disks","Firmware and boot instructions","Frequently used data held for immediate CPU access"],"a":2,"e":"ROM is non-volatile and stores firmware or boot instructions used when a computer starts."},{"q":"USB flash drives, memory cards and external hard drives are examples of which type of storage?","o":["Primary memory","Secondary storage","Processing components","CPU registers"],"a":1,"e":"These removable or external devices provide secondary storage for long-term data retention."},{"q":"Which primary-memory type is described as tiny, ultra-fast storage locations inside the CPU?","o":["ROM","RAM","External drives","Registers"],"a":3,"e":"Registers are tiny, ultra-fast locations inside the CPU."},{"q":"Which type of memory provides temporary working space for programs and data currently being used?","o":["ROM","RAM","SSD","HDD"],"a":1,"e":"RAM is the computer's temporary working memory for active programs and data."},{"q":"A user loses power while editing a document that has not been saved. Which memory type’s contents are cleared when power is removed?","o":["SSD","RAM","HDD","ROM"],"a":1,"e":"RAM is volatile, so unsaved work in it is lost when power is removed."},{"q":"Which item is NOT normally listed as a computer's device specification?","o":["Battery life","Weight","Printer type","Connectivity"],"a":2,"e":"Common device specifications include CPU, RAM, storage, graphics, display, battery life, weight and connectivity. Printer type is not a core computer specification category."},{"q":"A general-purpose computer will be used for programming, databases, multitasking and data analysis. Which processor and core combination best matches the stronger configuration in the course comparison?","o":["Intel Core i3 / AMD Ryzen 3 with 4–6 cores","Intel Core i9 with 24 cores","Intel Core i3 with 6–10+ cores","Intel Core i5 / Core Ultra 5 or AMD Ryzen 5 with 6–10+ cores"],"a":3,"e":"The stronger general-purpose example uses a Core i5/Core Ultra 5 or Ryzen 5 class processor with 6–10+ cores. Actual suitability depends on the exact model and workload."},{"q":"Which uses are listed for the ‘good’ general-purpose PC but not for the average one?","o":["Web browsing, Word and email","Databases, data analysis and AI-assisted applications","Word, PowerPoint and basic programming","Web browsing and PowerPoint only"],"a":1,"e":"Databases, data analysis and AI-assisted applications are listed only for the good PC."},{"q":"What distinguishes msinfo32 from Settings > System > About?","o":["msinfo32 opens System Information with broader hardware and system details; About is a quick route to basic device information","msinfo32 opens Task Manager; About opens Device Manager","About shows more detail than msinfo32","They open the same screen with the same level of detail"],"a":0,"e":"msinfo32 shows broader system details; Settings > System > About gives the quick basics."},{"q":"A laptop is advertised with an estimated battery life of 6 hours. Which factor could cause its actual battery life to be shorter?","o":["Running demanding applications at high screen brightness","Leaving the laptop idle with the screen off","Using a lower screen brightness and light workload","Closing applications that are not needed"],"a":0,"e":"Battery life depends on workload, screen brightness, settings, battery condition and other factors; advertised estimates are not guarantees."},{"q":"A laptop product listing gives these specifications: 16-inch display, 16 GB RAM and 512 GB SSD. Which statement correctly interprets them?","o":["The screen measures 16 inches diagonally, RAM provides working memory, and the SSD stores files long term","The 16-inch figure is the amount of RAM","The SSD is temporary memory used only while programs run","The 512 GB figure describes the display resolution"],"a":0,"e":"The display size, RAM capacity and SSD capacity describe three different parts of a laptop: screen, working memory and persistent storage."},{"q":"In the university purchase scenario, which conclusion best follows the supplied guidance?","o":["Computer B is always correct because it is more expensive","The better choice depends on budget, course software, lifespan and need; the pricier computer is not automatically correct","Computer A is always correct because it is cheaper","The choice depends only on the brand name"],"a":1,"e":"The right choice depends on budget, course software and lifespan; pricier is not automatically better."},{"q":"A university compares two computers for programming classes. Computer A has a Core i3, 8 GB RAM, 256 GB SSD and integrated graphics. Computer B has a Core i5, 16 GB RAM, 512 GB SSD and integrated graphics. What do the two computers have in common?","o":["Both have 16 GB RAM","Both have 512 GB SSD storage","Both have an Intel Core i5 processor","Both use integrated graphics"],"a":3,"e":"Both computers use integrated graphics, even though their listed processor, RAM and storage specifications differ."},{"q":"What does NVMe refer to when describing an SSD?","o":["A type of RAM module","A graphics processing chip","A wireless networking standard","A storage interface/protocol commonly used by fast SSDs"],"a":3,"e":"NVMe is a storage interface/protocol commonly used by fast solid-state drives."},{"q":"Which pair of lines describes the wireless and webcam specifications of a ‘good’ general-purpose laptop?","o":["Wi-Fi 6/6E or newer with Bluetooth; 1080p or better webcam","Wi-Fi and Bluetooth; 720p webcam","Ethernet only; no webcam","Bluetooth only; 4K webcam"],"a":0,"e":"A good laptop lists Wi-Fi 6/6E or newer with Bluetooth and a 1080p or better webcam."},{"q":"Speakers and headphones provide which type of computer output?","o":["Printed output","Visual output","Hard-copy output","Audio output"],"a":3,"e":"Speakers and headphones convert computer output into sound."},{"q":"Two 24-inch monitors are sold, one at 1920 x 1080 and one at 3840 x 2160. Which characteristic differs?","o":["Resolution","Screen size","Refresh rate","Touchscreen capability"],"a":0,"e":"Same screen size but different pixel counts means the resolution differs."},{"q":"A user upgrades from a 60 Hz monitor to a 144 Hz monitor. What has increased?","o":["The number of times the display updates its image each second","The number of pixels in the image","The diagonal size of the screen","The type of panel technology"],"a":0,"e":"Refresh rate is how many times per second the display updates, not pixel count."},{"q":"What does OLED stand for, and what does IPS refer to?","o":["Organic Light-Emitting Diode; In-Plane Switching, a type of LCD panel technology","Optical Laser Emitting Display; Internal Pixel Scaling","Organic Light-Emitting Diode; Internal Pixel Scaling","Output Line Extension Device; In-Plane Scanning, a type of printer"],"a":0,"e":"OLED is Organic Light-Emitting Diode; IPS is In-Plane Switching, an LCD panel type."},{"q":"Which pairing of printer type and typical use is correct?","o":["Inkjet - high-volume office text using toner; laser - photographs using liquid ink","Inkjet - scanning documents; laser - routing data","Inkjet - audio output; laser - touch input","Inkjet - colour printing and photographs at home or in small offices; laser - fast, high-quality text in offices"],"a":3,"e":"Inkjet suits colour and photos; laser suits fast, high-quality office text."},{"q":"Which pair of devices can both send and receive information, or accept input while providing output?","o":["A touchscreen and a network interface card (NIC)","A monitor and a printer","A mouse and a keyboard","A router and a projector"],"a":0,"e":"A touchscreen displays information and receives touch input. A NIC sends and receives network data."},{"q":"A computer lab has wired PCs that must talk to each other and also reach the internet. Which pairing of devices and roles is correct?","o":["A router connects the PCs within the lab; a switch forwards traffic to the internet","An access point connects wired PCs; a Wi-Fi adapter forwards traffic to the internet","A switch connects the PCs within the local network; a router forwards traffic between the lab and other networks","A NIC forwards traffic between networks; a switch provides wireless access"],"a":2,"e":"A switch connects devices within a local network; a router forwards traffic between networks."},{"q":"A student selects a saved document with a mouse, the computer retrieves it from an SSD, the CPU coordinates the work, RAM holds it while it is open, and the monitor displays it. Which role mapping is correct?","o":["Monitor — input; SSD — processing; CPU — storage; RAM — output","Mouse — output; SSD — active memory; CPU — display; RAM — storage","Mouse — input; SSD — storage; CPU — processing and coordination; RAM — working memory; monitor — output","Keyboard — storage; SSD — input; CPU — output; RAM — processing"],"a":2,"e":"The mouse supplies input, the SSD provides persistent storage, the CPU processes and coordinates, RAM holds active information, and the monitor provides visual output."},{"q":"A desktop PC has no wireless capability, and wireless laptops in a hall need to join the network. Which hardware fits each need?","o":["An access point for the desktop; a switch for the laptops","A switch for the desktop; a projector for the laptops","A Wi-Fi adapter for the desktop; an access point for the wireless devices","A router for the desktop; a Wi-Fi adapter for the laptops"],"a":2,"e":"A Wi-Fi adapter gives a computer wireless connectivity; an access point lets wireless devices join the network."}];
const TOTAL=D.length, BS=10, LIMIT=60*60;
const L="ABCD";
let S=null, tick=null;
const $=s=>document.querySelector(s);
const app=$("#app");
const esc=t=>String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function renderVisual(v){if(!v)return "";return '<section class="visual" aria-label="'+esc(v.title)+'"><div class="visual-title">'+esc(v.title)+'</div><div class="visual-grid">'+v.devices.map(d=>'<div class="visual-device"><h3>'+esc(d.name)+'</h3>'+d.stats.map(s=>'<div class="visual-stat"><span>'+esc(s[0])+'</span><strong>'+esc(s[1])+'</strong></div>').join("")+'</div>').join("")+'</div><p class="visual-caption">'+esc(v.caption)+'</p></section>'}


function fresh(){return {i:0,ans:Array(TOTAL).fill(null),graded:[],end:0,done:false}}
function fmt(s){s=Math.max(0,s);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function remaining(){return Math.round((S.end-Date.now())/1000)}

function start(){
  S=fresh(); S.end=Date.now()+LIMIT*1000;
  clearInterval(tick); tick=setInterval(onTick,500); onTick(); showQ();
}
function onTick(){
  const r=remaining(); const t=$("#tm"); t.textContent=fmt(r); t.classList.toggle("low",r<=300);
  if(r<=0 && !S.done){ timeUp(); }
}
function timeUp(){
  const b=Math.floor(S.i/BS);
  clearInterval(tick); $("#tm").textContent="00:00";
  // If the user is already viewing a graded block, do not grade/show it again.
  // The timer has expired, so go straight to the final results.
  if(S.graded.includes(b)){
    finish();
    return;
  }
  S.graded.push(b);
  S.done=true;
  showBlock(b,true);
}
function progress(){ const n=S.ans.filter(a=>a!==null).length; $("#pg").style.width=(n/TOTAL*100)+"%"; }

function home(){
  $("#tm").textContent="60:00"; $("#pg").style.width="0";
  app.innerHTML=`<div class="card"><span class="pill">Practice quiz</span><h1>Introduction to Computing<br>Videos 2 to 10</h1>
  <p class="mute">100 multiple-choice questions, 60 minutes in total.</p>
  <ul class="rules"><li>Ten blocks of 10 questions. After each block you get a grade.</li>
  <li>Every wrong or skipped answer is shown with the correct answer and the reasoning.</li>
  <li>You can move back and forth inside a block before grading it. Once graded, a block is locked.</li>
  <li>The timer keeps running for the whole quiz. When it hits zero, the quiz ends and unanswered questions count as wrong.</li></ul>
  <button class="btn" id="go">Start the 60-minute quiz</button></div>`;
  $("#go").onclick=start;
}

function showQ(){
  const i=S.i, b=Math.floor(i/BS), q=D[i], first=b*BS, last=first+BS-1;
  progress();
  let dots="";
  for(let k=first;k<=last;k++) dots+=`<div class="dot ${S.ans[k]!==null?"done":""} ${k===i?"cur":""}" data-k="${k}">${k+1}</div>`;
  app.innerHTML=`<div class="card"><span class="pill">Block ${b+1} of ${TOTAL/BS} &middot; Question ${i+1} of ${TOTAL}</span>
  <p class="q">${esc(q.q)}</p>\n  ${renderVisual(q.visual)}
  ${q.o.map((o,k)=>`<button class="opt ${S.ans[i]===k?"sel":""}" data-k="${k}"><span class="l">${L[k]}</span><span>${esc(o)}</span></button>`).join("")}
  <div class="nav"><button class="btn ghost" id="pv" ${i===first?"disabled":""}>Back</button>
  <button class="btn" id="nx">${i===last?"Grade this block":"Next"}</button></div>
  <div class="dots">${dots}</div></div>`;
  app.querySelectorAll(".opt").forEach(e=>e.onclick=()=>{S.ans[i]=+e.dataset.k;showQ();});
  app.querySelectorAll(".dot").forEach(e=>e.onclick=()=>{S.i=+e.dataset.k;showQ();});
  $("#pv").onclick=()=>{S.i--;showQ();};
  $("#nx").onclick=()=>{ if(i===last){ if(!S.graded.includes(b)) S.graded.push(b); showBlock(b,false);} else {S.i++;showQ();} };
  window.scrollTo(0,0);
}

function blockScore(b){let s=0;for(let k=b*BS;k<(b+1)*BS;k++) if(S.ans[k]===D[k].a) s++;return s}
function showBlock(b,timedOut){
  progress();
  const sc=blockScore(b); let wrong="";
  for(let k=b*BS;k<(b+1)*BS;k++){
    const q=D[k], a=S.ans[k];
    if(a!==q.a){
      wrong+=`<div class="rev"><b>Question ${k+1}.</b> ${esc(q.q)}<br>
      <p style="margin:8px 0 2px"><b class="w">Your answer:</b> ${a===null?"No answer":L[a]+". "+esc(q.o[a])}</p>
      <p style="margin:0"><b class="k">Correct answer:</b> ${L[q.a]}. ${esc(q.o[q.a])}</p>
      <div class="why"><b>Why:</b> ${esc(q.e)}</div></div>`;
    }
  }
  const last=b===TOTAL/BS-1;
  app.innerHTML=`<div class="card"><span class="pill">Block ${b+1} graded</span>
  <div class="score">${sc}/${BS}</div><p class="mute">${timedOut?"Time is up. Unanswered questions count as wrong.":sc===BS?"Perfect block.":"Review the explanations below before moving on."}</p>
  ${wrong||`<div class="allgood">Every answer in this block was correct. Nice work.</div>`}
  <div class="nav" style="margin-top:14px"><span></span>
  <button class="btn" id="c">${timedOut||last?"See final results":"Continue to block "+(b+2)}</button></div></div>`;
  $("#c").onclick=()=>{ if(timedOut||last){ finish(); } else { S.i=(b+1)*BS; showQ(); } };
  window.scrollTo(0,0);
}

function finish(){
  S.done=true; clearInterval(tick); progress();
  const per=[]; let tot=0;
  for(let b=0;b<TOTAL/BS;b++){ const s=blockScore(b); per.push(s); tot+=s; }
  const att=S.ans.filter(a=>a!==null).length, pct=Math.round(tot/TOTAL*100);
  const used=LIMIT-Math.max(0,remaining());
  app.innerHTML=`<div class="card"><span class="pill">Final results</span>
  <div class="score">${tot}/${TOTAL}</div><p class="mute">${pct}% correct &middot; ${att} answered &middot; time used ${fmt(used)}</p>
  ${per.map((s,b)=>`<div class="row"><span class="n">Block ${b+1}</span><span class="t"><i style="width:${s*10}%"></i></span><span class="v">${s}/10</span></div>`).join("")}
  <div class="nav" style="margin-top:16px"><span></span><button class="btn" id="re">Retake the quiz</button></div></div>`;
  $("#re").onclick=home; window.scrollTo(0,0);
}
home();
</script>
